# Worked example: NeMo, filled from its AGENTS.md and skills.
# Use it to see how real rules map to profile fields.
schema_version: 1

project:
  name: NeMo
  summary: Fast, local first expense and income tracker.
  mode: existing
  platforms: [web, pwa]

stack:
  language: javascript
  framework: React 19
  bundler: Vite
  styling: Tailwind v4
  router: none
  state: React context
  package_manager: npm
  test_runner: Vitest
  linter: Oxlint
  backend: Supabase (optional sync)
  auth: Supabase
  database: Supabase Postgres
  hosting: Vercel

commands:
  install: npm install
  dev: npm run dev
  lint: npm run lint
  test: npm test
  build: npm run build
  check: npm run check
  test_single: npx vitest run {path}
  deploy: npm run deploy

structure:
  layers:
    - path: src/components/ui
      purpose: primitives with no app logic
    - path: src/components/layout
      purpose: app shell, navigation, command palette
    - path: src/components/shared
      purpose: pieces used by 2 or more screens
    - path: src/components/log
      purpose: parts used only by the Log screen
    - path: src/components/views
      purpose: one file per screen or sheet
    - path: src/context
      purpose: providers (Auth, Settings, Transaction)
    - path: src/hooks
      purpose: context accessors and small hooks
    - path: src/lib
      purpose: supabase client, format, haptics, motion tokens
    - path: src/utils
      purpose: pure functions (analytics, seed data)
    - path: src/test
      purpose: test setup
    - path: supabase
      purpose: schema.sql
  root_allowed: [src/, package.json, package-lock.json, skills-lock.json, index.html, vite.config.js, vercel.json, .oxlintrc.json, .gitignore, README.md, AGENTS.md, public/, supabase/, .agents/]
  tests: colocated

naming:
  - {item: "React component, screen or provider", style: PascalCase.jsx, example: LogView.jsx}
  - {item: Hook, style: camelCase.js starting with use, example: useTheme.js}
  - {item: "Helper, util or lib", style: camelCase.js, example: format.js}
  - {item: Test, style: same name plus .test, example: LogView.test.jsx}
  - {item: Folder, style: lowercase, example: components/ui}
  - {item: Element id or test id, style: kebab-case, example: btn-log-expense}
  - {item: CSS variable, style: "--kebab-case", example: --surface-2}

design:
  enabled: true
  tokens_file: src/index.css
  component_dirs: [src/components/ui, src/components/shared]
  enforced_by: src/design-rules.test.js

responsive:
  enabled: true
  min_width: 320
  max_width: 2560
  touch_target_px: 44
  breakpoints:
    - {from: 320, layout: "bottom bar, single column"}
    - {from: 768, layout: "icon rail, centered dialogs"}
    - {from: 1024, layout: "full sidebar, recent panel"}
    - {from: 1440, layout: "grids grow, max width 1800px"}

data:
  storage: localStorage with optional Supabase sync
  schema_source: supabase/schema.sql
  invariants:
    - Every transaction stores one epoch timestamp. Date, weekday, hour block and month are derived from it.
    - Payloads have a positive amount, a valid category and no undefined values.
  protected:
    - Storage keys
    - Transaction shape
    - Supabase schema

git:
  commit_format: "<type>(<scope>): <present tense subject>"
  single_line: true
  types: [feat, fix, refactor, style, test, docs, chore]
  scopes: [entry, numpad, categories, insights, history, storage, analytics, csv, pwa, layout, styles, skills, docs]
  push: never
  stage: granular

verification:
  zero_warnings: true
  browser_checks:
    - 0 console errors and 0 warnings
    - Contrast meets WCAG AA in both themes
    - Event listeners and timers clean up on unmount
    - Every control reachable by keyboard
  post_build_report: true

capabilities:
  deploy:
    enabled: true
    command: npm run deploy
    verify_url: https://ne-mo-app.vercel.app
    on_failure: self-heal
    max_attempts: 3
    reference: ""
  browser_inspection:
    enabled: false
    reference: ""
  backend:
    enabled: false
    reference: ""
  security_review:
    enabled: false
    reference: ""

external_references: []

rules:
  - {id: ui-primitives, area: design, text: "Use components from src/components/ui and tokens from src/index.css. Do not hand roll buttons, inputs or modals.", enforced_by: manual}
  - {id: ui-monochrome, area: design, text: "The interface is black and white only. Gray tints come from tokens.", enforced_by: test}
  - {id: ui-chart-color, area: design, text: "Color is allowed only in charts through --chart-* tokens. Only InsightsView.jsx, utils/analytics.js and index.css may use them.", enforced_by: test}
  - {id: ui-no-raw-hex, area: design, text: "No raw hex values outside index.css. No Tailwind palette colors.", enforced_by: test, check: {type: forbid, pattern: '(?<![\w&/])#(?:[0-9a-fA-F]{8}|[0-9a-fA-F]{6}|[0-9a-fA-F]{3,4})\b', include: ["src/**/*.{js,jsx,ts,tsx,css,html}"], exclude: ["src/index.css"]}}
  - {id: ui-no-emoji, area: design, text: "No emojis anywhere.", enforced_by: test, check: {type: forbid, pattern: '[\U0001F300-\U0001FAFF\u2600-\u27BF]', include: ["src/**/*.{js,jsx,ts,tsx,css,html,md}"]}}
  - {id: ui-minimal-copy, area: design, text: "Keep copy to 1 or 2 words. No helper text or taglines.", enforced_by: manual}
  - {id: ui-icons, area: design, text: "Use Lucide icons only. Icon-only controls need an aria-label and a tooltip.", enforced_by: manual}
  - {id: ui-status-no-color, area: design, text: "Show status with icon, weight or shape. Never with color.", enforced_by: manual}
  - {id: ui-select, area: design, text: "All selects use the Select primitive: height capped at max-h-60 or max-h-64, monochrome tokens, internal scroll, search above 10 options.", enforced_by: manual}
  - {id: ui-shortcuts, area: design, text: "Shortcuts work on macOS, Windows and Linux: check metaKey and ctrlKey, use e.code for Option chords, support Delete and Backspace, show platform hints, guard typing in inputs.", enforced_by: manual}
  - {id: ui-a11y, area: design, text: "Use semantic HTML, visible focus states, 44px tap targets and WCAG AA contrast.", enforced_by: manual}
  - {id: tok-all-in-css, area: tokens, text: "All tokens live in src/index.css. Components read them through Tailwind utilities or CSS variables.", enforced_by: manual}
  - {id: tok-both-themes, area: tokens, text: "Every token has a dark and a light value. Light is the exact inversion of dark.", enforced_by: manual}
  - {id: motion-every-change, area: motion, text: "Every state change animates: hover, focus, press, route, modal, toast, list change, theme switch, chart draw.", enforced_by: manual}
  - {id: motion-tokens, area: motion, text: "Use the motion tokens only: --dur-fast, --dur-base, --dur-slow, --ease-out, --ease-in-out in CSS and src/lib/motion.js in code.", enforced_by: manual}
  - {id: motion-transform, area: motion, text: "Animate transform and opacity. Do not animate layout properties.", enforced_by: manual}
  - {id: motion-reduced, area: motion, text: "Do not bypass MotionConfig reducedMotion in App.jsx.", enforced_by: manual}
  - {id: motion-cleanup, area: motion, text: "Clean up listeners, intervals, animation frames and object URLs on unmount.", enforced_by: manual}
  - {id: resp-css-nav, area: responsive, text: "Navigation is CSS driven. Do not branch layout in JavaScript.", enforced_by: manual}
  - {id: resp-log-fit, area: responsive, text: "The Log screen fits a 320 by 640 viewport without scrolling.", enforced_by: manual}
  - {id: resp-units, area: responsive, text: "Use dvh, safe area insets and clamp(). Never block zoom.", enforced_by: manual}
  - {id: resp-input-16, area: responsive, text: "Form inputs use at least 16px on mobile and coarse pointers. Text inputs reset window scroll on blur.", enforced_by: manual}
  - {id: struct-root, area: structure, text: "The repo root holds only config, README.md and AGENTS.md.", enforced_by: test, check: {type: root_only}}
  - {id: name-one-component, area: naming, text: "One component per file. The file name equals the default export.", enforced_by: manual}
  - {id: data-settings-context, area: data, text: "Read and write settings through SettingsContext only.", enforced_by: manual}
  - {id: data-rls, area: data, text: "Use selective indexes and Row Level Security policies for Supabase Postgres.", enforced_by: manual}
  - {id: sec-boundaries, area: security, text: "Audit client side data boundaries, local storage tokens, input sanitization and dependencies.", enforced_by: manual}
  - {id: sec-no-secrets, area: security, text: "Never store raw secrets or unvalidated third party input.", enforced_by: manual}
  - {id: verify-check, area: verify, text: "Run npm run check before you finish. It must pass with 0 errors and 0 warnings.", enforced_by: manual}
  - {id: proc-no-sed, area: process, text: "Do not use sed for edits.", enforced_by: manual}
  - {id: proc-ask-destructive, area: process, text: "Ask before destructive changes such as deleting data models, migrations or breaking API changes.", enforced_by: manual}
  - {id: docs-sync, area: docs, text: "Update README.md, AGENTS.md and the affected skills in the same change as any structure, token, route or command change.", enforced_by: manual}

docs:
  readme: README.md
  agents_file: AGENTS.md
  skills_dir: .agents/skills
  repo_map: .agents/repo-map.md
